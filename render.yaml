services:
  - type: web
    name: agroai-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: 'commit'
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
